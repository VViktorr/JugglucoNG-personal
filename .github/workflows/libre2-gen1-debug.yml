name: Libre 2 Gen1 Kotlin debug APK

on:
  push:
    branches: [libre2-gen1-kotlin]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libre2-gen1-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-debug:
    if: github.ref == 'refs/heads/libre2-gen1-kotlin'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        run: scripts/dist/install-sdk.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore verified native libraries
        run: scripts/restore-build-inputs.sh
      - name: Build ARM64 phone debug APK
        run: >-
          ./gradlew :Common:assembleMobileDebug
          -PjugglucoAbi=arm64-v8a
          --no-daemon --no-configuration-cache --max-workers=1 --stacktrace
      - name: Verify APK and package ID
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(Common/build/outputs/apk/mobile/debug/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          test "$("$build_tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")" = tk.glucodata.ng.debug
          "$build_tools/apksigner" verify "$apk"
          unzip -t "$apk" lib/arm64-v8a/libg.so
          mkdir -p build/gen1-debug
          cp "$apk" build/gen1-debug/JugglucoNG-Gen1-Kotlin-arm64-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JugglucoNG-Gen1-Kotlin-arm64-debug
          path: build/gen1-debug/*.apk
          if-no-files-found: error
          retention-days: 14
