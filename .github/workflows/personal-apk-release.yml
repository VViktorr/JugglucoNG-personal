name: Personal APKs — Exact release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.4.1'
        required: true
        default: '1.4.1'
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/personal-apk-build.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
