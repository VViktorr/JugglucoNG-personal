name: Personal phone and Wear OS APKs
run-name: Phone and Wear OS APKs from ${{ github.ref_name }} at ${{ github.sha }}

on:
  workflow_dispatch:

env:
  APK_VERSION: 1.4.0.${{ github.run_number }}

permissions:
  contents: read

concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone:
    name: Phone release APK (ARM32 + ARM64)
    if: github.repository == 'VViktorr/JugglucoNG-personal'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        run: scripts/dist/install-sdk.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore and verify pinned sensor libraries
        run: scripts/restore-build-inputs.sh
      # Personal build uses this repository's existing fallback signing key.
      # It does not use or claim the upstream production signing identity.
      - name: Assemble phone release
        run: >-
          ./gradlew :Common:assembleMobileRelease
          -PjugglucoAbi=arm64-v8a,armeabi-v7a
          -PpersonalBuildNumber=${{ github.run_number }}
          --no-daemon --no-configuration-cache --max-workers=1 --stacktrace
      - name: Verify and stage APK
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import zipfile

          apks = list(Path('Common/build/outputs/apk/mobile/release').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one phone release APK, got {len(apks)}')
          apk = apks[0]
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          subprocess.run([str(signer), 'verify', '--verbose', '--print-certs', str(apk)], check=True)
          inventory = json.loads(Path('scripts/dist/build-inputs.json').read_text())
          with zipfile.ZipFile(apk) as archive:
              for abi in ('arm64-v8a', 'armeabi-v7a'):
                  archive.getinfo(f'lib/{abi}/libg.so')
              for spec in inventory['files']:
                  relative = spec['path'].split('/jniLibs/')[1]
                  if relative.split('/')[0] in {'arm64-v8a', 'armeabi-v7a'}:
                      payload = archive.read('lib/' + relative)
                      if hashlib.sha256(payload).hexdigest() != spec['sha256']:
                          raise SystemExit(f'Packaged sensor library mismatch: {relative}')
          out = Path('build/personal-apk')
          out.mkdir(parents=True, exist_ok=True)
          staged = out / f'JugglucoNG-{os.environ["APK_VERSION"]}-phone.apk'
          shutil.copy2(apk, staged)
          digest = hashlib.sha256(staged.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {staged.name}\n')
          (out / 'build-info.json').write_text(json.dumps({
              'version': os.environ['APK_VERSION'], 'sha': os.environ['GITHUB_SHA'], 'branch': os.environ['GITHUB_REF_NAME'],
              'abis': ['arm64-v8a', 'armeabi-v7a'], 'variant': 'mobileRelease',
              'signing': 'repository fallback key', 'sha256': digest
          }, indent=2) + '\n')
      - name: Generate phone update manifest
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          assets = Path('build/personal-apk')
          version = os.environ['APK_VERSION']
          apk = assets / f'JugglucoNG-{version}-phone.apk'
          aapt2 = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/aapt2'
          badging = subprocess.check_output([str(aapt2), 'dump', 'badging', str(apk)], text=True)
          package = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'", badging, re.M)
          sdk = re.search(r"^sdkVersion:'([0-9]+)'", badging, re.M)
          if not package or not sdk or package[1] != 'tk.glucodata.ng' or package[3] != version:
              raise SystemExit('Unexpected phone APK package metadata')
          with apk.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          manifest = {
              'schema': 1,
              'versionName': version,
              'versionCode': int(package[2]),
              'minSdk': int(sdk[1]),
              'artifacts': [{
                  'applicationId': package[1],
                  'file': apk.name,
                  'size': apk.stat().st_size,
                  'sha256': digest,
              }],
          }
          (assets / 'update-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JugglucoNG-main5-phone-arm-${{ github.sha }}
          path: build/personal-apk/
          if-no-files-found: error
          retention-days: 14

  wear:
    name: Wear OS release APK (ARM32 + ARM64)
    if: github.repository == 'VViktorr/JugglucoNG-personal'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        run: scripts/dist/install-sdk.sh
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore and verify pinned sensor libraries
        run: scripts/restore-build-inputs.sh
      # Personal build uses this repository's existing fallback signing key.
      # It does not use or claim the upstream production signing identity.
      - name: Assemble Wear OS release
        run: >-
          ./gradlew :Common:assembleWearRelease
          -PjugglucoAbi=arm64-v8a,armeabi-v7a
          -PpersonalBuildNumber=${{ github.run_number }}
          --no-daemon --no-configuration-cache --max-workers=1 --stacktrace
      - name: Verify and stage APK
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import zipfile

          apks = list(Path('Common/build/outputs/apk/wear/release').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one Wear OS release APK, got {len(apks)}')
          apk = apks[0]
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          subprocess.run([str(signer), 'verify', '--verbose', '--print-certs', str(apk)], check=True)
          inventory = json.loads(Path('scripts/dist/build-inputs.json').read_text())
          with zipfile.ZipFile(apk) as archive:
              for abi in ('arm64-v8a', 'armeabi-v7a'):
                  archive.getinfo(f'lib/{abi}/libg.so')
              for spec in inventory['files']:
                  relative = spec['path'].split('/jniLibs/')[1]
                  if relative.split('/')[0] in {'arm64-v8a', 'armeabi-v7a'}:
                      payload = archive.read('lib/' + relative)
                      if hashlib.sha256(payload).hexdigest() != spec['sha256']:
                          raise SystemExit(f'Packaged sensor library mismatch: {relative}')
          out = Path('build/personal-wear-apk')
          out.mkdir(parents=True, exist_ok=True)
          staged = out / f'JugglucoNG-{os.environ["APK_VERSION"]}-wear.apk'
          shutil.copy2(apk, staged)
          digest = hashlib.sha256(staged.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {staged.name}\n')
          (out / 'build-info.json').write_text(json.dumps({
              'version': os.environ['APK_VERSION'], 'sha': os.environ['GITHUB_SHA'], 'branch': os.environ['GITHUB_REF_NAME'],
              'abis': ['arm64-v8a', 'armeabi-v7a'], 'variant': 'wearRelease',
              'signing': 'repository fallback key', 'sha256': digest
          }, indent=2) + '\n')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JugglucoNG-main5-wear-arm-${{ github.sha }}
          path: build/personal-wear-apk/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish phone and Wear OS release
    needs: [phone, wear]
    if: github.repository == 'VViktorr/JugglucoNG-personal' && github.ref == 'refs/heads/main5'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download phone APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --name "JugglucoNG-main5-phone-arm-${{ github.sha }}" --dir build/release/phone
      - name: Download Wear OS APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --name "JugglucoNG-main5-wear-arm-${{ github.sha }}" --dir build/release/wear
      - name: Prepare release files and changelog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release/assets
          cp build/release/phone/*.apk build/release/wear/*.apk build/release/assets/
          cp build/release/phone/update-manifest.json build/release/assets/
          cp build/release/phone/build-info.json build/release/assets/phone-build-info.json
          cp build/release/wear/build-info.json build/release/assets/wear-build-info.json
          cat build/release/phone/SHA256SUMS.txt build/release/wear/SHA256SUMS.txt > build/release/assets/SHA256SUMS.txt
          (cd build/release/assets && sha256sum --check SHA256SUMS.txt)
          previous=$(git describe --tags --match 'main5-build-*' --match 'main5-v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$previous" ]; then
            previous=3ceeab9d09a66552b9e691a6c0f70d552e732a3e
          fi
          {
            echo '## JugglucoNG personal — main5'
            echo
            echo '- Phone: release APK for ARM32 and ARM64.'
            echo '- Wear OS: release APK for ARM32 and ARM64.'
            echo '- Both APKs compiled from the same commit; bundled sensor libraries and APK signatures verified.'
            echo '- Build success does not confirm operation on a physical device.'
            echo
            awk '/^## Changes in this fork$/{show=1; print; next} show && /^## /{exit} show{print}' README.md
            echo '## Commits in this release'
            echo
            git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo "Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > build/release/notes.md
      - name: Publish release with both APKs
        env:
          GH_TOKEN: ${{ secrets.APK_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="main5-v${APK_VERSION}"
          # Create the tag separately so a permission failure identifies the blocked operation.
          if ! git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null || {
              echo "::error::Could not create $tag. Check tag rules and the APK_RELEASE_TOKEN repository secret."
              exit 1
            }
          fi
          git fetch --no-tags origin "refs/tags/$tag"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag $tag does not point at the APK source commit."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/release/assets/* --clobber
            gh release edit "$tag" --notes-file build/release/notes.md
          else
            gh release create "$tag" build/release/assets/* \
              --verify-tag \
              --title "JugglucoNG personal main5 — ${APK_VERSION}" \
              --notes-file build/release/notes.md
          fi
