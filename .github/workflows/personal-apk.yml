name: Personal APKs — Numbered build

on:
  push:
    branches: [allnew]
    paths:
      - '.github/workflows/personal-apk.yml'
  workflow_dispatch:
    inputs:
      base_version:
        description: 'Base version, e.g. 1.4.0'
        required: true
        default: '1.4.0'
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/personal-apk-build.yml
    with:
      version: ${{ format('{0}.{1}', inputs.base_version || '1.4.0', github.run_number) }}
    secrets: inherit
