// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '9.5.3' apply false
    id 'com.android.library' version '9.5.3' apply false
    // AGP provides built-in Kotlin; resolve its compiler and the Compose plugin together.
    id 'org.jetbrains.kotlin.android' version '2.5.0-RC2' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.5.0-RC2' apply false
}



tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
